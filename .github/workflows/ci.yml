name: Mind-Mesh CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend - Lint and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://Mind-Mesh-project/frontend/.env
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_JOAV3ZBvYRJQLGH_QvRnfw_1CTmIBbE
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_JOAV3ZBvYRJQLGH_QvRnfw_1CTmIBbE
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend - Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --directory backend --extra dev

      - name: Run pytest
        run: uv run --directory backend pytest
