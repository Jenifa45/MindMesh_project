[project]
name = "backend"
version = "0.1.0"
description = "MindMesh"
readme = "README.md"

requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.160.0",
    "httpx==0.28.1",
    "pydantic>=2.14.1",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.2.4",
    "python-jose>=3.5.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.15.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]



